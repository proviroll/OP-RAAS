version: '3.9'

services:
  redis-db:
    extends:
      file: ./services/redis.yml
      service: redis-db
    networks:
      - my-bridge-network
    ports:
      - "6379:6379" # Expose Redis port

  db-init:
    extends:
      file: ./services/db.yml
      service: db-init
    networks:
      - my-bridge-network

  db:
    depends_on:
      db-init:
        condition: service_completed_successfully
    extends:
      file: ./services/db.yml
      service: db
    networks:
      - my-bridge-network
    ports:
      - "7432:5432" # Expose PostgreSQL port

  backend:
    depends_on:
      - db
      - redis-db
    extends:
      file: ./services/backend.yml
      service: backend
    links:
      - db:database
    networks:
      - my-bridge-network
    ports:
      - "4000:4000" # Expose backend port

  visualizer:
    extends:
      file: ./services/visualizer.yml
      service: visualizer
    networks:
      - my-bridge-network
    ports:
      - "8051:8050"
      - "36823:36823"

  sig-provider:
    extends:
      file: ./services/sig-provider.yml
      service: sig-provider
    networks:
      - my-bridge-network
    ports:
      - "8052:8050" # Example port for sig-provider

  frontend:
    depends_on:
      - backend
    extends:
      file: ./services/frontend.yml
      service: frontend
    networks:
      - my-bridge-network
    ports:
      - "3000:3000"
      - "39123:39123"

  stats-db-init:
    extends:
      file: ./services/stats.yml
      service: stats-db-init
    networks:
      - my-bridge-network

  stats-db:
    depends_on:
      stats-db-init:
        condition: service_completed_successfully
    extends:
      file: ./services/stats.yml
      service: stats-db
    networks:
      - my-bridge-network
    ports:
      - "7433:5432"

  stats:
    depends_on:
      - stats-db
      - backend
    extends:
      file: ./services/stats.yml
      service: stats
    networks:
      - my-bridge-network
    ports:
      - "8053:8050"

  user-ops-indexer:
    depends_on:
      - db
      - backend
    extends:
      file: ./services/user-ops-indexer.yml
      service: user-ops-indexer
    networks:
      - my-bridge-network
    ports:
      - "8054:8050"

  proxy:
    depends_on:
      - backend
      - frontend
      - stats
    extends:
      file: ./services/nginx.yml
      service: proxy
    networks:
      - my-bridge-network
    ports:
      - "80:80"
      - "8080:8080"
      - "8081:8081"
networks:
  my-bridge-network:
    driver: bridge
