name: Deploy Optimism Environment

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - feat/testnet-setup
  workflow_dispatch:
    inputs:
      rollup_name:
        description: 'Rollup Name'
        required: true
        type: string
      chain_id:
        description: 'Chain ID'
        required: true
        type: string
        default: '271'
      l1_network:
        description: 'L1 Network (e.g., sepolia)'
        required: true
        type: string
        default: 'sepolia'
      data_availability:
        description: 'Data Availability Layer'
        required: true
        type: string
      settlement_layer:
        description: 'Settlement Layer'
        required: true
        type: string
      rollup_id:
        description: 'Rollup ID'
        required: true
        type: string


jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
      - name: Create deployment branch
        run: |
          BRANCH_NAME="deploy-${{ inputs.ecosystem_name }}-${{ inputs.l1_network }}-$(date +%Y%m%d-%H%M%S)"
          echo "BRANCH_NAME=${BRANCH_NAME}" >> $GITHUB_ENV
          git checkout -b $BRANCH_NAME
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
            ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: |
            mkdir -p ~/.ssh
            ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      - name: Copy files to remote host
        run: |
          ssh ${{ secrets.DEPLOY_USERNAME }}@${{ secrets.DEPLOY_HOST }} "mkdir -p ~/optimism-deploy/${{ env.BRANCH_NAME }}"
          scp -r ./* ${{ secrets.DEPLOY_USERNAME }}@${{ secrets.DEPLOY_HOST }}:~/optimism-deploy/${{ env.BRANCH_NAME }}/
      - name: Build and run initialization
        env:
          REMOTE_USER: ${{ secrets.DEPLOY_USERNAME }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh ${{ secrets.DEPLOY_USERNAME }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            cd ~/optimism-deploy/${{ env.BRANCH_NAME }}
            # Create artifacts directory
            mkdir -p artifacts
            
            # Create .env file 
            echo "L2_CHAIN_ID=\"${{ inputs.chain_id }}\"" >> testnet_tutorial/.env
            echo "L1_NETWORK=\"${{ inputs.l1_network }}\"" >> testnet_tutorial/.env
            echo "L1_RPC_KIND=\"alchemy\"" >> testnet_tutorial/.env
            echo "ROLLUP_NAME=\"${{ inputs.rollup_name }}\"" >> testnet_tutorial/.env
            echo "DEPLOYMENT_CONTEXT=\"${{ inputs.rollup_name }}\"" >> testnet_tutorial/.env
            echo "FAUCET_ADDRESS=\"${{ secrets.FAUCET_ADDRESS }}\"" >> testnet_tutorial/.env
            echo "FAUCET_PRIVATE_KEY=\"${{ secrets.FAUCET_PRIVATE_KEY }}\"" >> testnet_tutorial/.env
            echo "L1_RPC_URL=\"${{ secrets.RPC_URL }}\"" >> testnet_tutorial/.env
            echo "ROLLUP_ID=\"${{ inputs.rollup_id }}\"" >> testnet_tutorial/.env
            # Change to testnet_tutorial directory before running docker-compose commands
            cd testnet_tutorial

            
            docker-compose up --build
            # Wait for the container to finish and check its logs
            echo "Waiting for initialization to complete..."
            while docker ps | grep -q optimism-init; do
              sleep 10
              echo "Still waiting for initialization..."
            done
            # After container finishes, the wallets.yaml will be in testnet_tutorial/script/
            if [ -f testnet_tutorial/script/wallets.yaml ]; then
              mkdir -p artifacts
              cp testnet_tutorial/script/wallets.yaml artifacts/
            fi
          ENDSSH
      - name: Save wallets
        run: |
          mkdir -p artifacts
          # Only attempt to copy if remote artifacts directory is not empty
          ssh ${{ secrets.DEPLOY_USERNAME }}@${{ secrets.DEPLOY_HOST }} "[ -d ~/optimism-deploy/${{ env.BRANCH_NAME }}/artifacts ] && [ \"\$(ls -A ~/optimism-deploy/${{ env.BRANCH_NAME }}/artifacts)\" ] && exit 0 || exit 1" && \
          scp ${{ secrets.DEPLOY_USERNAME }}@${{ secrets.DEPLOY_HOST }}:~/optimism-deploy/${{ env.BRANCH_NAME }}/artifacts/* artifacts/ || \
          echo "No artifacts to copy"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: optimism-wallets-${{ env.BRANCH_NAME }}
          path: artifacts/