version: '3.8'

services:
  optimism-deployer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: optimism-deployer
    volumes:
      - optimism_data:/app
      - ~/.ssh:/root/.ssh:ro
      - .env:/app/.env
    ports:
      - "8545:8545"  # L2 RPC
      - "8546:8546"  # L2 WS
      - "9545:9545"  # Sequencer RPC
      - "7545:7545"  # Batcher RPC
      - "8551:8551"  # Engine API
    networks:
      - optimism-net

networks:
  optimism-net:
    driver: bridge

volumes:
  optimism_data:
